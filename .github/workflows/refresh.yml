name: Refresh catalog
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated snapshot to R2
        type: boolean
        default: false
  schedule:
    - cron: '17 20 * * *'
permissions:
  contents: read
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.MW_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pipeline.run
      - name: Restore last good observations
        if: inputs.publish || github.event_name == 'schedule'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET: ${{ vars.R2_DATA_BUCKET }}
        run: python -m pipeline.publish --restore
      - name: Mirror a bounded batch of new official images
        if: vars.MW_MIRROR_IMAGES == 'true' && (inputs.publish || github.event_name == 'schedule')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ASSETS_BUCKET: ${{ vars.R2_ASSETS_BUCKET }}
          ASSETS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}
        run: python -m pipeline.images --official artifacts/ingestion/bandai.json --limit 50 --upload
      - name: Build snapshot
        run: python -m pipeline.build --ingestion artifacts/ingestion --previous artifacts/api/previous.json
      - name: Publish snapshot
        if: inputs.publish || github.event_name == 'schedule'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DATA_BUCKET: ${{ vars.R2_DATA_BUCKET }}
        run: python -m pipeline.publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ingestion-review
          path: |
            artifacts/ingestion/report.json
            artifacts/api/unmatched.json
          retention-days: 3
